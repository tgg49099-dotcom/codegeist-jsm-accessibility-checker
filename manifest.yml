# Forge manifest — "Portal Accessibility Checker for JSM"
# App id: ari:cloud:ecosystem::app/33f1227e-0df1-4008-b181-ea9c50b116f5
#
# MODULES — four, and nothing else:
#
#   * `jira:adminPage` — the interface (render: native, UI Kit 2). The official
#     reference (https://developer.atlassian.com/platform/forge/manifest-reference/modules/jira-admin-page.md)
#     describes where the page appears and the URL it gets
#     (/jira/settings/apps/{appId}/{envId}); it names NO role and NO permission
#     for opening it. This app therefore does not claim that the page is
#     administrator-only: a signed-in user who can open Jira administration can
#     open the page, and the app checks the rights ITSELF, on the server
#     (src/resolvers.js). The scan is refused to anyone who does not hold the
#     global Jira permission ADMINISTER ("Administer Jira") or SYSTEM_ADMIN
#     ("Jira System Administrators"). The check is made with the caller's own
#     identity, through
#     `GET /rest/api/3/mypermissions?permissions=ADMINISTER,SYSTEM_ADMIN`
#     (Jira Cloud REST API v3, group "Permissions":
#     https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-permissions/).
#   * `function` — the resolver the page calls (src/resolvers.js) and the two
#     handlers behind the MCP tools. It answers ONLY to the signed-in user who
#     pressed the button, and it refuses any call that carries no account id.
#   * `action` — the two MCP tools.
#   * `rovo:mcp` — the Atlassian MCP server, which exposes those two tools.
#
# There is NO public trigger: this manifest used to declare one — an
# unauthenticated URL that ran a scan of the customer's site and answered in
# clear text to whoever held it — and it was removed. Every module declared
# below is reachable only from an authenticated session, so this app has no
# public URL. The absence is checkable by reading this file, and by
# `python3 tools/verifier-manifest-cycle134.py`.
#
# IDENTITY — this app acts on behalf of a person, so it reads with `asUser()`.
# The Marketplace security review ("Security requirements for cloud apps",
# section "Forge apps") says:
#
#   1. "An application must default to using asUser() when performing an
#      operation on behalf of the user."
#   2. "Before making calls using asApp(), you must verify the expected
#      permissions (for example, from product context) with the permissions
#      REST APIs."
#
# Rule 1 is honoured everywhere. Rule 2 cannot apply here: this application
# contains ZERO `asApp()` call, so there is no wider identity to justify. Where
# rights must be checked (the administration permission), they are checked with
# the caller's own identity through the permissions REST API — see
# src/resolvers.js.
#
# The scopes are UNCHANGED and still read-only:
#   read:jira-work             (Jira issues: descriptions, summaries, fields)
#   read:servicedesk-request   (JSM: request types, form fields, help text)
# The permissions REST API above needs no extra scope: the official page lists
# the classic scope `read:jira-work`, which the app already declares.
#
# The app writes nothing, calls no external service and stores nothing.
#
# The runtime stays nodejs24.x / 256 MB / arm64.

modules:
  jira:adminPage:
    - key: pac-jsm-admin-page
      title: Portal Accessibility Checker for JSM
      resource: admin
      resolver:
        function: resolver
      render: native
  function:
    - key: resolver
      handler: resolvers.handler
    - key: mcp-scan
      handler: mcp.scanAccessibility
    - key: mcp-last-findings
      handler: mcp.listLastFindings
  action:
    - key: scan_accessibility
      name: Scan the customer portal for accessibility
      function: mcp-scan
      actionVerb: GET
      description: >
        Runs the read-only WCAG 2.2 AA scan of the customer portal of the site where this
        app is installed and returns the findings. The site is read with your own Jira
        permissions. Nothing is written or stored.
      inputs:
        url:
          title: Customer portal URL
          type: string
          required: true
          description: >
            The absolute URL of the customer portal to scan, for example
            https://your-site.atlassian.net/servicedesk/customer/portals
    - key: list_last_findings
      name: List the current accessibility findings
      function: mcp-last-findings
      actionVerb: GET
      description: >
        Returns the current WCAG 2.2 AA findings of the site where this app is installed,
        as a compact list. The site is read with your own Jira permissions. The app stores
        nothing, so these are the findings current at the time of the call.
      inputs: {}
  rovo:mcp:
    - key: pac-jsm-mcp
      name: Portal Accessibility Checker
      tools:
        - scan_accessibility
        - list_last_findings

resources:
  - key: admin
    path: src/frontend/admin.jsx

permissions:
  scopes:
    - read:jira-work
    - read:servicedesk-request

app:
  id: ari:cloud:ecosystem::app/33f1227e-0df1-4008-b181-ea9c50b116f5
  description: Reports WCAG 2.2 AA accessibility findings on your Jira Service Management customer portal; it reads only and never modifies anything; it also exposes two read-only tools to Atlassian's MCP server
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
